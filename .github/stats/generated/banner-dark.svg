<svg width="860" height="242" viewBox="0 0 860 242" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nurysso: eulix, vanish, tyr, hecate">
<title>Nurysso</title>
<style>:root{--panel:#151b27;--line:#27314a;--ink:#e8ecf5;--mute:#8a95ad;--ember:#ffb454;--dim:#53617f;--track:#222b3f}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1}
.name{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-size:42px;font-weight:700}
.role{font-size:12.5px;fill:var(--mute)}
.fn{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.proj{font-size:14px;font-weight:600}
.leaf{font-size:13px}
.note{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;fill:var(--dim)}
.edge{fill:none;stroke:var(--dim);stroke-width:1.4}
.edge.hot{stroke:var(--ember);stroke-width:2}
.node{fill:var(--panel);stroke:var(--dim);stroke-width:1.4}
.node.hot{fill:var(--ember);stroke:var(--ember)}
.root{fill:var(--ember)}
@media (prefers-reduced-motion: no-preference){
  .edge{stroke-dasharray:1;animation:draw 520ms cubic-bezier(.3,.7,.2,1) backwards}
  .in{animation:show 260ms ease-out backwards}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes show{from{opacity:0}to{opacity:1}}
}
</style>
<rect class="panel" x="1" y="1" width="858" height="240" rx="16"/>
<text class="name" x="220" y="104.0" text-anchor="end">Nurysso</text>
<text class="role" x="220" y="132.0" text-anchor="end">Systems engineer.</text>
<text class="role" x="220" y="150.0" text-anchor="end">Compilers, code analysis,</text>
<text class="role" x="220" y="168.0" text-anchor="end">developer tooling.</text>
