name: Koi

on:
  schedule:
    - cron: '20 0 * * *' # daily, just after midnight UTC, so the koi shows the day that just ended
  workflow_dispatch: # manual "Run workflow" button
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to the v1.0.2 commit so a moved tag can't change what runs.
      - name: Draw the koi
        uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          body: gold
          size: 768x256 # a pond that isn't square swims a new track each day
          scale: '1' # keeps the GIF light enough for GitHub's mobile app
          output-dir: .github/koi

      - name: Commit the koi if it changed
        run: |
          git add .github/koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          # the stats workflow may have pushed in the meantime
          git pull --rebase --quiet
          git push --quiet
